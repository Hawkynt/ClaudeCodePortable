name: Nightly

# Fires after CI signals success on master/main. A red CI run will never
# produce a nightly, so the "latest" nightly always points at tested code.
# Nightly builds use _build.yml, the same recipe tag releases use.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  meta:
    # Gate on upstream CI when triggered by workflow_run; allow manual dispatch
    # (which has no workflow_run payload) to run unconditionally.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      date:    ${{ steps.m.outputs.date }}
      version: ${{ steps.m.outputs.version }}
      tag:     ${{ steps.m.outputs.tag }}
      sha:     ${{ steps.m.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the exact SHA CI validated, not whatever is at branch tip now.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0
      - id: m
        run: |
          DATE=$(date -u +%Y-%m-%d)
          VERSION=$(perl .github/workflows/scripts/version.pl)
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "date=$DATE"         >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"   >> "$GITHUB_OUTPUT"
          echo "tag=nightly-$DATE"  >> "$GITHUB_OUTPUT"
          echo "sha=$SHA"           >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    uses: ./.github/workflows/_build.yml
    with:
      version: ${{ needs.meta.outputs.version }}
      release-kind: nightly
      changelog-flag: --nightly --version ${{ needs.meta.outputs.version }}
      ref: ${{ needs.meta.outputs.sha }}

  publish:
    needs: [meta, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: dist

      - name: Delete same-date nightly if it exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ needs.meta.outputs.tag }}" -R "${{ github.repository }}" >/dev/null 2>&1; then
            gh release delete "${{ needs.meta.outputs.tag }}" -R "${{ github.repository }}" --cleanup-tag --yes
          fi

      - name: Publish nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.meta.outputs.tag }}" \
              -R "${{ github.repository }}" \
              --title "Nightly ${{ needs.meta.outputs.date }} (${{ needs.meta.outputs.version }})" \
              --prerelease \
              --notes "Automated build of commit \`${{ needs.meta.outputs.sha }}\`.

          Version: \`${{ needs.meta.outputs.version }}\`

          Unpack and run \`Claude.bat\` (Windows) or \`./claude.sh\` (Linux/macOS)." \
              dist/*.zip

  prune:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: GFS prune of old nightlies (7 daily + 4 weekly + 3 monthly)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/workflows/scripts/prune-nightlies.mjs
